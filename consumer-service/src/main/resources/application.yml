server:
  # 8082: the producer owns 8080, the Schema Registry 8081, Kafka UI 8090.
  port: 8082

spring:
  application:
    name: consumer-service

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    # The consumer is also a producer. Retry and dead-letter routing works by republishing the
    # failed record to another topic, so the KafkaTemplate behind @RetryableTopic must be able
    # to serialise an Avro Order. Without this block Spring Boot auto-configures a template with
    # the default StringSerializer, every republish fails with
    #   "Can't convert value of class ...avro.Order to class StringSerializer"
    # and the record is redelivered from the original topic forever instead of retrying.
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
      acks: all
      properties:
        schema.registry.url: ${SCHEMA_REGISTRY_URL:http://localhost:8081}
        # Must stay true. Subjects follow the default TopicNameStrategy, so republishing to the
        # retry and dead-letter topics needs orders.v1-retry-0-value, orders.v1-retry-1-value and
        # orders.v1-dlt-value registered as well - the producer service only ever registers
        # orders.v1-value. With this false, every republish fails with
        #   "Error retrieving latest version of Avro schema"
        # and the record is redelivered from the original topic forever.
        auto.register.schemas: true

    consumer:
      group-id: ${CONSUMER_GROUP_ID:orders-consumer-v1}
      # Only applies when the group has no committed offset, so a fresh consumer catches up
      # on orders published before it started rather than silently skipping them.
      auto-offset-reset: earliest
      # Both deserializers are wrapped: a record that cannot be deserialised is handed to the
      # error handler instead of being thrown on the poll thread, which would otherwise stop
      # the listener container dead.
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: io.confluent.kafka.serializers.KafkaAvroDeserializer
        schema.registry.url: ${SCHEMA_REGISTRY_URL:http://localhost:8081}
        # Deliver the generated Order type rather than a GenericRecord.
        specific.avro.reader: true
    listener:
      # One consumer thread against one partition, so the running average is deterministic
      # and reproducible in the recorded demonstration.
      concurrency: 1

app:
  orders-topic: ${ORDERS_TOPIC:orders.v1}
  retry:
    # Three total processing attempts: the original plus two retries, which is what produces
    # the two retry topics orders.v1-retry-0 and orders.v1-retry-1.
    attempts: ${RETRY_ATTEMPTS:3}
    delay-ms: ${RETRY_DELAY_MS:2000}

logging:
  pattern:
    # Timestamps matter: the two-second retry delay has to be visible on screen in Task 7.
    console: "%d{HH:mm:ss.SSS} %-5level %-28logger{0} : %msg%n"
  level:
    root: INFO
    com.ashfaq.bigdata: INFO
    # Framework chatter is turned down so the demonstration output stays readable.
    org.apache.kafka: WARN
    org.springframework.kafka: WARN
