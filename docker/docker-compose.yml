# Local Kafka stack for the Chapter 3 assignment.
#
#   docker compose up -d
#
# Brings up a single-node Kafka broker in KRaft mode (no ZooKeeper), the Confluent
# Schema Registry that stores order.avsc, a browser UI for inspecting topics live,
# and a one-shot job that creates the topics the application expects.
#
# Every dependency is gated on a healthcheck rather than a plain `depends_on`, because
# Schema Registry exits on startup if the broker is not yet accepting connections --
# the classic way this stack fails on demo day.

name: kafka-avro-orders

services:

  kafka:
    image: confluentinc/cp-kafka:7.9.9
    container_name: kafka
    hostname: kafka
    ports:
      # Host applications connect here. In-cluster services use kafka:29092 instead.
      - "9092:9092"
    environment:
      # --- KRaft: this node is both the controller and the broker ---
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"

      # --- Listeners ---
      # PLAINTEXT      : traffic between containers (schema-registry, kafka-ui, init)
      # PLAINTEXT_HOST : traffic from the Java apps running on the Windows host
      KAFKA_LISTENERS: "PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"

      # --- Single-node sizing: nothing to replicate to ---
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # Topics are created explicitly by kafka-init below. Auto-creation is disabled so a
      # typo in a topic name fails loudly instead of silently inventing an empty topic.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  schema-registry:
    image: confluentinc/cp-schema-registry:7.9.9
    container_name: schema-registry
    hostname: schema-registry
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: "kafka:29092"
      SCHEMA_REGISTRY_LISTENERS: "http://0.0.0.0:8081"
      # Reject a new schema version that existing consumers could not read.
      SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: "backward"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/subjects"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  kafka-init:
    image: confluentinc/cp-kafka:7.9.9
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    # Runs once, creates the topics, exits 0. `--if-exists` keeps `up` idempotent.
    command: >
      bash -c "
        set -e
        echo 'Creating topics...'
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists
          --topic orders --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists
          --topic orders.DLQ --partitions 1 --replication-factor 1
          --config retention.ms=604800000
        echo ''
        echo 'Topics now present:'
        kafka-topics --bootstrap-server kafka:29092 --list
      "
    restart: "no"

  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    container_name: kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: "local"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:29092"
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: "http://schema-registry:8081"
      DYNAMIC_CONFIG_ENABLED: "true"

volumes:
  kafka-data:
