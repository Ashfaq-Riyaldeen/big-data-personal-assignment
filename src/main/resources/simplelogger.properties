# The Kafka client logs its full effective configuration at INFO on every startup, and the
# consumer logs a line on each group rebalance. That output would scroll straight through the
# live dashboard, so the floor is raised to WARN: anything that actually matters (a broker that
# cannot be reached, a schema that will not resolve) still comes through.
#
# Set -Dorg.slf4j.simpleLogger.defaultLogLevel=info on the command line to get the detail back
# when diagnosing a connection problem.

org.slf4j.simpleLogger.defaultLogLevel=warn
org.slf4j.simpleLogger.log.org.apache.kafka=warn
org.slf4j.simpleLogger.log.io.confluent=warn

org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=HH:mm:ss
org.slf4j.simpleLogger.showThreadName=false
org.slf4j.simpleLogger.showLogName=false
org.slf4j.simpleLogger.showShortLogName=true
